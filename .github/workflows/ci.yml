name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    name: Demo (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # numpy 2.5 / pandas 3 pin Python >=3.12 (see requirements.txt).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Boots app.py headlessly with Streamlit's AppTest harness (no server, no
      # network) and asserts the three scalar predictions and the TreeSHAP panel
      # render. This is the exact command documented in the README.
      - name: Smoke test (AppTest)
        run: python test_app.py
