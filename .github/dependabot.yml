# Dependabot version updates.
# This repository is the demo half of the project (regenerated from the parent
# repo, never edited independently). Each ecosystem files a single grouped PR
# per week to keep the review load low for a single maintainer.
version: 2
updates:
  # Streamlit demo runtime (frozen model bundle)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-demo:
        patterns: ["*"]

  # Research pipeline (provenance copy of the parent's research/ module)
  - package-ecosystem: pip
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-research:
        patterns: ["*"]

  # GitHub Actions used by the workflow in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
